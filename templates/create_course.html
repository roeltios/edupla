{% extends 'layout.html' %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6">
        <h1 class="text-3xl font-black text-gray-900 dark:text-slate-100 tracking-tight">Nuevo Curso de Formacion</h1>
        <p class="mt-2 text-sm text-gray-500 dark:text-slate-400">Define una ruta para normalistas y pedagogos que se estan profesionalizando en tecnologia educativa.</p>
    </div>

    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 sm:p-6 space-y-5 dark:bg-slate-900 dark:border-slate-800">
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Titulo del Curso</label>
                <input type="text" name="title" required class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100" placeholder="Ej: Programacion para docentes de primaria">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Perfil Objetivo</label>
                <input type="text" name="target_profile" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100" placeholder="Ej: Normalistas sin perfil tecnico previo">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Duracion</label>
                <input type="text" name="duration" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100" placeholder="Ej: 6 semanas">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">URL para visor embebido (iframe)</label>
                <input type="url" name="viewer_url" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100" placeholder="https://tu-lms-o-curso.com/contenido">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Descripcion</label>
                <textarea name="description" rows="4" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100" placeholder="Que capacidades docentes desarrolla este curso?"></textarea>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Docentes asignados</label>
                <select name="teacher_ids[]" multiple class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 min-h-28 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}">{{ teacher.full_name }} · {{ teacher.email }}</option>
                    {% endfor %}
                </select>
                <p class="mt-1 text-xs text-gray-500 dark:text-slate-400">Mantener Ctrl/Cmd para seleccionar varios.</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-3 uppercase tracking-wider">Modulos del Curso</label>
                <div id="module-area" class="space-y-3">
                    <input type="text" name="module_titles[]" placeholder="Modulo 1" class="w-full bg-gray-50 border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                </div>
                <button type="button" onclick="addModule()" class="mt-3 inline-flex items-center px-3 py-2 text-xs font-bold text-teal-600 bg-teal-50 rounded-lg hover:bg-teal-100 transition dark:bg-teal-900 dark:text-teal-200 dark:hover:bg-teal-800">+ Anadir modulo</button>
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="flex-1 bg-teal-600 text-white font-black py-3.5 rounded-xl shadow-lg shadow-teal-200 hover:bg-teal-700 transition">GUARDAR CURSO</button>
            <a href="{{ url_for('main.courses') }}" class="px-6 bg-white text-gray-500 dark:text-slate-300 font-bold py-3.5 rounded-xl border border-gray-200 hover:bg-gray-50 transition flex items-center dark:bg-slate-900 dark:border-slate-700 dark:hover:bg-slate-800">Cancelar</a>
        </div>
    </form>
</div>

<script>
function addModule() {
    const area = document.getElementById('module-area');
    const input = document.createElement('input');
    input.type = 'text';
    input.name = 'module_titles[]';
    input.placeholder = 'Nuevo modulo';
    input.className = 'w-full bg-gray-50 border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100';
    area.appendChild(input);
}
</script>
{% endblock %}
