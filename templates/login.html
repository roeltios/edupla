{% extends 'layout.html' %}

{% block content %}
<div class="max-w-md mx-auto pt-8">
    <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:bg-slate-900 dark:border-slate-800">
        <h1 class="text-2xl font-black text-gray-900 dark:text-slate-100">Iniciar sesion</h1>
        <p class="mt-2 text-sm text-gray-500 dark:text-slate-400">Accede como administrador o docente.</p>

        <form method="POST" class="mt-5 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url }}">

            <div>
                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-gray-500 dark:text-slate-400 mb-2">Email</label>
                <input type="email" name="email" required class="w-full rounded-xl border border-gray-300 bg-gray-50 p-3 text-sm focus:ring-2 focus:ring-teal-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-[0.2em] text-gray-500 dark:text-slate-400 mb-2">Contrasena</label>
                <input type="password" name="password" required class="w-full rounded-xl border border-gray-300 bg-gray-50 p-3 text-sm focus:ring-2 focus:ring-teal-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
            </div>

            <button type="submit" class="w-full rounded-xl bg-teal-600 py-3 text-sm font-bold text-white hover:bg-teal-500 transition">Entrar</button>
        </form>

        <div class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800 dark:border-amber-900 dark:bg-amber-950 dark:text-amber-200">
            Usuario inicial: admin@edupla.local<br>
            Contrasena inicial: admin1234
        </div>
    </div>
</div>
{% endblock %}
