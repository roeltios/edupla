{% extends 'layout.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6 flex flex-wrap items-start justify-between gap-3">
        <div>
            <h1 class="text-3xl font-black tracking-tight text-gray-900 dark:text-slate-100">Nueva Rubrica</h1>
            <p class="text-sm text-gray-500 dark:text-slate-400 mt-1">Crea un criterio reutilizable para el banco de rubricas.</p>
        </div>
        <a href="{{ url_for('main.rubric_bank') }}" class="inline-flex items-center rounded-lg border border-gray-300 px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50 transition dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800">Ver banco</a>
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm dark:bg-slate-900 dark:border-slate-800">
        <form method="POST" class="space-y-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Nombre</label>
                <input name="name" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Dimension</label>
                <input name="dimension" value="Pedagogia" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Peso (%)</label>
                <input name="default_weight" type="number" min="1" max="100" value="20" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Descripcion</label>
                <textarea name="description" rows="2" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"></textarea>
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Nivel 4</label>
                <textarea name="level_4" rows="2" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-xs dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"></textarea>
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Nivel 3</label>
                <textarea name="level_3" rows="2" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-xs dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"></textarea>
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Nivel 2</label>
                <textarea name="level_2" rows="2" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-xs dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"></textarea>
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-500 dark:text-slate-400">Nivel 1</label>
                <textarea name="level_1" rows="2" class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-xs dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"></textarea>
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-500 text-white rounded-lg px-4 py-2 text-sm font-bold transition">Guardar en banco</button>
        </form>
    </div>
</div>
{% endblock %}
