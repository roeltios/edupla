{% extends 'layout.html' %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6">
        <h1 class="text-3xl font-black text-gray-900 dark:text-slate-100 tracking-tight">Editar Recurso</h1>
        <p class="mt-2 text-sm text-gray-500 dark:text-slate-400">Actualiza contenido, tipo y vinculacion del recurso pedagogico.</p>
    </div>

    <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 sm:p-6 space-y-5 dark:bg-slate-900 dark:border-slate-800">
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Titulo</label>
                <input type="text" name="title" value="{{ resource.title }}" required class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Tipo de Recurso</label>
                    <select name="resource_type" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                        {% for t in ['document', 'video', 'infographic', 'guide'] %}
                        <option value="{{ t }}" {% if resource.resource_type == t %}selected{% endif %}>{{ t|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Enlace URL</label>
                    <input type="url" name="url" value="{{ resource.url }}" required class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Curso (opcional)</label>
                    <select name="course_id" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                        <option value="">Sin curso</option>
                        {% for course in courses %}
                        <option value="{{ course.id }}" {% if resource.course_id == course.id %}selected{% endif %}>{{ course.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Modulo (opcional)</label>
                    <select name="module_id" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
                        <option value="">Sin modulo</option>
                        {% for module in modules %}
                        <option value="{{ module.id }}" {% if resource.module_id == module.id %}selected{% endif %}>{{ module.course.title }} · M{{ module.sequence }} · {{ module.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-slate-300 mb-2 uppercase tracking-wider">Descripcion</label>
                <textarea name="description" rows="4" class="w-full bg-gray-50 border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-teal-600 focus:bg-white transition dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">{{ resource.description or '' }}</textarea>
            </div>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="flex-1 bg-teal-600 text-white font-black py-3.5 rounded-xl shadow-lg shadow-teal-200 hover:bg-teal-700 transition">GUARDAR CAMBIOS</button>
            <a href="{{ url_for('main.resources') }}" class="px-6 bg-white text-gray-500 dark:text-slate-300 font-bold py-3.5 rounded-xl border border-gray-200 hover:bg-gray-50 transition flex items-center dark:bg-slate-900 dark:border-slate-700 dark:hover:bg-slate-800">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
